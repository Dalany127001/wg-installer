# =============================================================================
# WireGuard Client Config — wg0.conf
# ⚠️  Fill this in with REAL values before running build-pkg.sh
# This file is unique per laptop — each laptop gets its own keypair + IP
# =============================================================================

[Interface]
PrivateKey = CLIENT_PRIVATE_KEY
Address = 10.0.0.X/24


DNS = 1.1.1.1

[Peer]
# Your WireGuard server's public key
PublicKey = SERVER_PUBLIC_KEY
Endpoint = <hostname>:51820


# For split tunnel (only internal traffic), replace with e.g. 10.10.0.0/24
AllowedIPs = 10.0.0.0/24

# Keeps tunnel alive through NAT
PersistentKeepalive = 25
